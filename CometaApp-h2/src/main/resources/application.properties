spring.application.name=CometaApp
server.port=8080

spring.datasource.username=SA
spring.datasource.password=

# JPA y DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.datasource.url=jdbc:h2:mem:cometa;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.driver-class-name=org.h2.Driver


#management.endpoint.metrics.access=read_only
management.endpoints.web.exposure.include=metrics,info
management.info.env.enabled=true
#management.endpoints.web.exposure.include=info


